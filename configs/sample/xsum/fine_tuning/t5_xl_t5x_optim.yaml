# Sample config for fine-tuning T5-xl (~3B) on XSum with FSDP2 and T5X's fine-tuning optimizer settings, an
# attempt to close the gap to the paper's SFT result (ROUGE-2 22; GKD, Agarwal et al., ICLR 2024, Appendix A.2).
# Identical to t5_xl.yaml except for the optimizer, the LR schedule, the checkpoint and the run name.
# Model:   LM-adapted T5 v1.1 xl (google/t5-xl-lm-adapt), as in the paper
# Dataset: EdinburghNLP/xsum; ROUGE-2 of greedy decoding on the validation split is the paper's metric
#
# The paper gives XL's fine-tuning only as 8,000 steps. t5_xl.yaml borrows the distillation runs' Adafactor
# settings (LR 3.0e-4, fixed step size) and adds a warmup and cooldown; it reaches 21.37 validation ROUGE-2.
# This config uses T5X's fine-tuning settings instead, which the paper's authors likely used: Adafactor with
# each update scaled by its weight's RMS (scale_parameter: True) and a constant LR of 1.0e-3. T5 weight RMS
# spans ~0.03-13 (T5-small), so a fixed step size barely moves the embeddings and the LM head within XL's
# 8,000 steps; see designs/xsum_gkd_reproduction.md. Batch size 32, 8,000 steps, dropout 0.1 and the rest
# are unchanged.
# Result (negative): 21.34 validation / 21.16 test ROUGE-2, against 21.37 / 21.40 for t5_xl.yaml, which
# remains the KD teacher.
#
# Not sized for one 24 GB GPU: fp32 weights and gradients of ~3B parameters alone take ~24 GB, so they are
# sharded over two GPUs with FSDP2, and gradient checkpointing keeps the 1024-token activations in check.
#
# Usage (bf16 on Ampere or newer; T5 overflows in fp16):
#   CUDA_VISIBLE_DEVICES=0,1 uv run accelerate launch --num_processes 2 --mixed_precision bf16 \
#     --use_fsdp --fsdp_version 2 --fsdp_reshard_after_forward true \
#     --fsdp_auto_wrap_policy TRANSFORMER_BASED_WRAP --fsdp_transformer_layer_cls_to_wrap T5Block \
#     --fsdp_state_dict_type FULL_STATE_DICT --fsdp_cpu_ram_efficient_loading false \
#     examples/hf_transformers/summarization.py \
#     --config configs/sample/xsum/fine_tuning/t5_xl_t5x_optim.yaml \
#     --run_log log/xsum/fine_tuning/t5_xl_t5x_optim.txt \
#     --seed 42

dependencies:
  - name: 'custom'

# XSum's own splits, plus a fixed 1% carve-out of the training split used only to monitor perplexity. The
# paper reports the validation split and selects no checkpoint, so no split that is reported is ever used
# for a decision; `ckpt_selection: 'last'` below keeps it that way
datasets:
  train: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'train[:99%]'
  monitor: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'train[99%:]'
  validation: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'validation'
  test: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'test'

preprocess:
  document_key: 'document'
  summary_key: 'summary'
  # The paper does not state its input format; this is the T5 convention
  input_prefix: 'summarize: '
  max_input_length: 1024
  max_target_length: 64
  base_split_name: 'train'
  batched: True
  num_proc: 8
  dataset_id_map:
    &train_dataset_id 'xsum/train': 'train'
    &monitor_dataset_id 'xsum/monitor': 'monitor'
    &val_dataset_id 'xsum/val': 'validation'
    &test_dataset_id 'xsum/test': 'test'

models:
  model:
    key: &model_key 'google/t5-xl-lm-adapt'
    tokenizer_kwargs:
      pretrained_model_name_or_path: *model_key
    model_kwargs:
      pretrained_model_name_or_path: *model_key
      # T5 v1.1's default, as in the student fine-tuning configs. Table A.1's 0.0 is for distillation
      dropout_rate: 0.1
    gradient_checkpointing: True
    _experiment: &experiment 't5_xl_t5x_optim'
    src_ckpt:
    dst_ckpt: !join ['./resource/ckpt/xsum/fine_tuning/', *experiment]

train:
  log_freq: 1000
  # max_steps caps the run; num_epochs only has to be large enough to reach it
  max_steps: &max_steps 8000
  num_epochs: 2
  ckpt_selection: 'last'
  train_data_loader:
    dataset_id: *train_dataset_id
    sampler:
      class_or_func: !import_get
        key: 'torch.utils.data.RandomSampler'
      kwargs:
    kwargs:
      # Per process: 4 x grad_accum_step 4 x 2 GPUs = 32, the paper's batch size. On a
      # single GPU, double grad_accum_step
      batch_size: 4
      num_workers: 4
      pin_memory: True
      drop_last: False
    collate_fn: 'Seq2SeqDataCollator'
    requires_supp: False
  val_data_loader:
    dataset_id: *monitor_dataset_id
    sampler: &val_sampler
      class_or_func: !import_get
        key: 'torch.utils.data.SequentialSampler'
      kwargs:
    kwargs:
      # T5's attention bias for a 1024-token batch of 16 takes 1 GiB per layer on top of the training state,
      # which overflows 24 GB
      batch_size: 4
      num_workers: 4
      pin_memory: True
      drop_last: False
    collate_fn: 'Seq2SeqDataCollator'
    requires_supp: False
  # No `pre_forward_proc`: plain fine-tuning on the reference summaries
  model:
    forward_proc: 'forward_batch_as_kwargs'
    adaptations:
    sequential: []
    forward_hook:
      input: []
      output: []
    wrapper:
    requires_grad: True
    frozen_modules: []
  optimizer:
    # T5's Adafactor as T5X fine-tunes with it: each update is scaled by the RMS of its weight. custom/optim.py
    # registers it as 'HFAdafactor', made DTensor-aware so that it factors the FSDP2-sharded parameters
    key: 'HFAdafactor'
    kwargs:
      lr: 1.0e-3
      scale_parameter: True
      relative_step: False
      warmup_init: False
    filters_params: True
    grad_accum_step: 4
  scheduler:
    # T5X's fine-tuning default: constant LR, no warmup or cooldown
    key: 'get_constant_schedule'
    kwargs: {}
    scheduling_step: 1
  criterion:
    key: 'WeightedSumLoss'
    kwargs:
      model_term:
        weight: 1.0
      sub_terms:
    func2extract_model_loss: 'extract_transformers_loss'

test:
  # Greedy decoding, as for the paper's Figure 1 and Figure A.13
  generation_kwargs:
    max_new_tokens: 64
    do_sample: False
    num_beams: 1
  test_data_loaders:
    # The paper's reporting split
    validation:
      dataset_id: *val_dataset_id
      sampler: *val_sampler
      kwargs:
        # Generation holds the full fp32 model plus autocast's bf16 weight copies; 8 left < 1 GB of headroom
        batch_size: 4
        num_workers: 4
        pin_memory: True
        drop_last: False
      collate_fn: 'Seq2SeqDataCollator'
    test:
      dataset_id: *test_dataset_id
      sampler: *val_sampler
      kwargs:
        # Generation holds the full fp32 model plus autocast's bf16 weight copies; 8 left < 1 GB of headroom
        batch_size: 4
        num_workers: 4
        pin_memory: True
        drop_last: False
      collate_fn: 'Seq2SeqDataCollator'

# Optional: remove this block (or pass -disable_tracker) to run without trackio
tracker:
  engine: 'trackio'
  kwargs:
    project: 'torchdistill-xsum'
    name: !join ['fine_tuning-', *experiment]
