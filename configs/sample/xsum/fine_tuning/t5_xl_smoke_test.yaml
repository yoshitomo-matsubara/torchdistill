# Smoke test of configs/sample/xsum/fine_tuning/t5_xl.yaml: 20 optimizer steps on 1,024 training samples,
# then the per-epoch perplexity pass, the checkpoint save and the final ROUGE evaluation on 256 validation and
# 256 test samples. Same model, batch sizes and FSDP setup as the full run, so it exercises the same peak memory.
# Temporary; do not commit. Delete ./resource/ckpt/xsum/smoke_test/ afterwards.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0,1 uv run accelerate launch --num_processes 2 --mixed_precision bf16 \
#     --use_fsdp --fsdp_sharding_strategy FULL_SHARD --fsdp_auto_wrap_policy TRANSFORMER_BASED_WRAP \
#     --fsdp_transformer_layer_cls_to_wrap T5Block --fsdp_state_dict_type FULL_STATE_DICT \
#     --fsdp_use_orig_params true \
#     --fsdp_cpu_ram_efficient_loading false --fsdp_sync_module_states true \
#     examples/hf_transformers/summarization.py \
#     --config configs/sample/xsum/fine_tuning/t5_xl_smoke_test.yaml \
#     --run_log log/xsum/smoke_test/t5_xl.txt \
#     --seed 42

dependencies:
  - name: 'custom'

# XSum's own splits, plus a fixed 1% carve-out of the training split used only to monitor perplexity. The
# paper reports the validation split and selects no checkpoint, so no split that is reported is ever used
# for a decision; `ckpt_selection: 'last'` below keeps it that way
datasets:
  train: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'train[:1024]'
  monitor: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'train[202005:202261]'
  validation: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'validation[:256]'
  test: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'EdinburghNLP/xsum'
        split: 'test[:256]'

preprocess:
  document_key: 'document'
  summary_key: 'summary'
  # The paper does not state its input format; this is the T5 convention
  input_prefix: 'summarize: '
  max_input_length: 1024
  max_target_length: 64
  base_split_name: 'train'
  batched: True
  num_proc: 8
  dataset_id_map:
    &train_dataset_id 'xsum/train': 'train'
    &monitor_dataset_id 'xsum/monitor': 'monitor'
    &val_dataset_id 'xsum/val': 'validation'
    &test_dataset_id 'xsum/test': 'test'

models:
  model:
    key: &model_key 'google/t5-xl-lm-adapt'
    tokenizer_kwargs:
      pretrained_model_name_or_path: *model_key
    model_kwargs:
      pretrained_model_name_or_path: *model_key
      # T5 v1.1 ships with dropout 0.1; the paper uses 0.0
      dropout_rate: 0.0
    gradient_checkpointing: True
    _experiment: &experiment 't5_xl_smoke_test'
    src_ckpt:
    dst_ckpt: !join ['./resource/ckpt/xsum/smoke_test/', *experiment]

train:
  log_freq: 5
  # max_steps caps the run; num_epochs only has to be large enough to reach it
  max_steps: &max_steps 20
  num_epochs: 1
  ckpt_selection: 'last'
  train_data_loader:
    dataset_id: *train_dataset_id
    sampler:
      class_or_func: !import_get
        key: 'torch.utils.data.RandomSampler'
      kwargs:
    kwargs:
      # Per process: 4 x grad_accum_step 4 x 2 GPUs = 32, the paper's batch size. On a
      # single GPU, double grad_accum_step
      batch_size: 4
      num_workers: 4
      pin_memory: True
      drop_last: False
    collate_fn: 'Seq2SeqDataCollator'
    requires_supp: False
  val_data_loader:
    dataset_id: *monitor_dataset_id
    sampler: &val_sampler
      class_or_func: !import_get
        key: 'torch.utils.data.SequentialSampler'
      kwargs:
    kwargs:
      # T5's attention bias for a 1024-token batch of 16 takes 1 GiB per layer on top of the training state,
      # which overflows 24 GB
      batch_size: 4
      num_workers: 4
      pin_memory: True
      drop_last: False
    collate_fn: 'Seq2SeqDataCollator'
    requires_supp: False
  # No `pre_forward_proc`: plain fine-tuning on the reference summaries
  model:
    forward_proc: 'forward_batch_as_kwargs'
    adaptations:
    sequential: []
    forward_hook:
      input: []
      output: []
    wrapper:
    requires_grad: True
    frozen_modules: []
  optimizer:
    # T5's Adafactor with an external LR schedule (custom/optim.py registers it as 'HFAdafactor')
    key: 'HFAdafactor'
    kwargs:
      lr: 3.0e-4
      scale_parameter: False
      relative_step: False
      warmup_init: False
    filters_params: True
    grad_accum_step: 4
  scheduler:
    # Linear warmup, constant, then linear cooldown to 0 over the last 2000 steps
    key: 'get_wsd_schedule'
    kwargs:
      num_warmup_steps: 5
      num_decay_steps: 5
      num_training_steps: *max_steps
      warmup_type: 'linear'
      decay_type: 'linear'
    scheduling_step: 1
  criterion:
    key: 'WeightedSumLoss'
    kwargs:
      model_term:
        weight: 1.0
      sub_terms:
    func2extract_model_loss: 'extract_transformers_loss'

test:
  # Greedy decoding, as for the paper's Figure 1 and Figure A.13
  generation_kwargs:
    max_new_tokens: 64
    do_sample: False
    num_beams: 1
  test_data_loaders:
    # The paper's reporting split
    validation:
      dataset_id: *val_dataset_id
      sampler: *val_sampler
      kwargs:
        batch_size: 8
        num_workers: 4
        pin_memory: True
        drop_last: False
      collate_fn: 'Seq2SeqDataCollator'
    test:
      dataset_id: *test_dataset_id
      sampler: *val_sampler
      kwargs:
        batch_size: 8
        num_workers: 4
        pin_memory: True
        drop_last: False
      collate_fn: 'Seq2SeqDataCollator'
