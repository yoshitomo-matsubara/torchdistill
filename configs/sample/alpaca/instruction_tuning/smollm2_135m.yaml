# Sample config for plain instruction tuning (no teacher) using torchdistill.
# Model:   SmolLM2-135M-Instruct (135M)
# Dataset: tatsu-lab/alpaca  (instruction-following, train-split only;
#          split into 95 % train / 5 % test here via !call_method).
#
# This is the *baseline* for the SmolLM2 on-policy KD configs in
# configs/sample/alpaca/on_policy_kd/smollm2_135m_from_smollm2_{360m,1_7b}.yaml: the same student, dataset,
# split, sequence lengths, optimizer, scheduler and budget, trained only on the off-policy cross-entropy over
# the reference completions (no teacher, no KL term). Since no teacher model is defined, the example script
# builds a training box instead of a distillation box, and the criterion reduces to the model (task) loss.
# Compare its test perplexity against the distilled students to isolate the gain from distillation.
#
# SmolLM2 was pre-trained in bf16 and has a small (49,152-entry) vocabulary, which keeps both the numerical
# range and the log-softmax tensors in the KD loss well within a free-tier T4.
#
# Usage (add `--mixed_precision fp16` on a T4, or `bf16` on an L4/A100):
#   accelerate launch examples/hf_transformers/causal_language_modeling.py \
#     --config configs/sample/alpaca/instruction_tuning/smollm2_135m.yaml \
#     --run_log log/alpaca/instruction_tuning/smollm2_135m.txt \
#     --seed 42

dependencies:
  - name: 'custom'

# Load Alpaca and create a 95/5 train/test split (identical seed to the KD configs for a fair comparison)
datasets: &raw_datasets !call_method
  obj: !import_call
    key: 'datasets.load_dataset'
    init:
      kwargs:
        path: 'tatsu-lab/alpaca'
        split: 'train'
  method_name: 'train_test_split'
  kwargs:
    test_size: 0.05
    seed: 42

preprocess:
  prompt_key: 'instruction'
  response_key: 'output'
  max_prompt_length: 256
  max_length: 512
  base_split_name: 'train'
  batched: True
  # The prompts are wrapped in SmolLM2's chat template, which the instruct tokenizer ships.
  # Switch to the base checkpoints (drop the '-Instruct' suffix) and set this to False for a
  # base-model experiment; the vocabulary is the same either way
  use_chat_template: True
  system_prompt: 'You are a helpful assistant.'
  dataset_id_map:
    &train_dataset_id 'alpaca/train': 'train'
    &val_dataset_id   'alpaca/val':   'test'
    &test_dataset_id  'alpaca/test':  'test'

# No `teacher_model` entry here, which is what makes this a teacher-free baseline
models:
  model:
    key: &model_key 'HuggingFaceTB/SmolLM2-135M-Instruct'
    tokenizer_kwargs:
      pretrained_model_name_or_path: *model_key
      use_fast: True
    model_kwargs:
      pretrained_model_name_or_path: *model_key
    _experiment: &experiment 'smollm2_135m'
    src_ckpt:
    dst_ckpt: !join ['./resource/ckpt/alpaca/instruction_tuning/', *experiment]

train:
  log_freq: 100
  num_epochs: &num_epochs 3
  train_data_loader:
    dataset_id: *train_dataset_id
    sampler:
      class_or_func: !import_get
        key: 'torch.utils.data.RandomSampler'
      kwargs:
    kwargs:
      batch_size: &train_batch_size 4
      num_workers: 2
      pin_memory: True
      drop_last: False
    collate_fn: 'OnPolicyDataCollator'
    requires_supp: False
  val_data_loader:
    dataset_id: *val_dataset_id
    sampler: &val_sampler
      class_or_func: !import_get
        key: 'torch.utils.data.SequentialSampler'
      kwargs:
    kwargs:
      batch_size: 8
      num_workers: 2
      pin_memory: True
      drop_last: False
    collate_fn: 'OnPolicyDataCollator'
    requires_supp: False
  # No `pre_forward_proc`: there are no on-policy rollouts to generate without a teacher to score them
  model:
    # The batch carries the prompt tensors the instruction pipeline adds for on-policy rollouts;
    # `forward_batch_as_kwargs` drops the entries the model's forward does not accept
    forward_proc: 'forward_batch_as_kwargs'
    adaptations:
    sequential: []
    forward_hook:
      input: []
      output: []
    wrapper:
    requires_grad: True
    frozen_modules: []
  optimizer:
    key: 'optimizer_no_decay'
    kwargs:
      optimizer_key: 'AdamW'
      lr: 5.0e-5
      weight_decay: 0.0
    filters_params: False
    max_grad_norm: 1.0
    grad_accum_step: &grad_accum_step 4
  scheduler:
    key: 'get_linear_schedule_with_warmup'
    kwargs:
      num_warmup_steps: 100
      num_training_steps: !import_call
        key: 'custom.optim.compute_num_training_steps'
        init:
          kwargs:
            dataset: !access_by_index_or_key
              data: *raw_datasets
              index_or_key: 'train'
            batch_size: *train_batch_size
            num_epochs: *num_epochs
            grad_accum_step: *grad_accum_step
            world_size: 1
    scheduling_step: 1
  # L_total = L_task: the cross-entropy over the reference completions (prompt tokens are masked with -100),
  # i.e. the `alpha = 1` corner of the KD configs' weighted sum, with no sub terms
  criterion:
    key: 'WeightedSumLoss'
    kwargs:
      model_term:
        weight: 1.0
      sub_terms:
    func2extract_model_loss: 'extract_transformers_loss'

test:
  test_data_loader:
    dataset_id: *test_dataset_id
    sampler: *val_sampler
    kwargs:
      batch_size: 8
      num_workers: 2
      pin_memory: True
      drop_last: False
    collate_fn: 'OnPolicyDataCollator'
